# i3blocks configuration file
#
# The i3blocks man page describes the usage of the binary,
# and its website describes the configuration:
#
#     https://vivien.github.io/i3blocks


# Global properties

command=~/.config/i3/scripts/$BLOCK_NAME
separator_block_width=20
separator=false
markup=none

[vpn]
label= 
command=bash /etc/vpn-config/vpnpanel.sh
interval=1
color=#3BB92D

[cpu_usage]
label= 
interval=1
color=#47d693

[memory]
label= 
interval=1
color=#47d693

[disk]
label= 
interval=30
color=#47d693

[iface]
label=󰖩 
interval=1
color=#47d693

[volume]
label=
interval=1

[load_average]
label= 
interval=1
color=#47d693

[time]
label=󱑆 
command=date '+%A, %d %B %Y %I:%M:%S '
#command=date '+%d-%m-%d %I:%M:%S'
interval=1
color=#47d693

